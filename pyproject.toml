[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openstack-image-builder"
version = "0.1.0"
description = "Plan OpenStack image build inputs"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2"]

[project.scripts]
oib = "openstack_image_builder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["openstack_image_builder"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "G", "I", "LOG", "S", "UP", "W", "C90"]
external = ["H"]
ignore = [
    "S101",
    "S105",
    "S106",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["openstack_image_builder"]
force-single-line = true
lines-after-imports = 2
lines-between-types = 1
section-order = ["future", "standard-library", "third-party", "first-party"]
force-sort-within-sections = false

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.format]
quote-style = "preserve"
docstring-code-format = true
