[tox]
envlist = unit,linters
toxworkdir = {toxinidir}/.tmp/tox

[testenv]
skip_install = true
setenv =
    PYTHONPYCACHEPREFIX = {toxinidir}/.tmp/python-cache
passenv =
    STREAM
    TARGET
    REGISTRY
    NAMESPACE
    TAG
    IMAGE_PREFIX
    BASE_IMAGE
    BASE_OS_IMAGE
    BUILD_PLATFORM
    CONSTRAINTS_FILE
    BUILD_CONSTRAINTS_FILE
    DEFAULT_STREAM
    SKIP_HASH_UPDATE
    PIP_NO_BINARY
    REGISTRY_AUTH_FILE
    REGISTRY_CERT_DIR
    PARALLEL
    BUILD_LOGS_DIR
    UPDATE_LOCKFILES_TARGETS
    S2I_CONTEXTS_ROOT
    ERROR_ON_CLONE
# pin to pip==26.1.2 as 26.2 has broken pip-tools
deps =
    pip-tools==7.6.0
    pybuild-deps==0.5.0
    pip==26.1.2
    PyYAML>=6.0.2
allowlist_externals =
    bash

[testenv:{unit,test,py3}]
description = Run all non-Ansible tests through stdlib unittest
commands =
    python -m unittest discover -s {toxinidir}/tests -p 'test_*.py' -v {posargs}

[testenv:linters]
description = Run formatting and style checks through pre-commit
deps =
    pre-commit>=3.0.0
skip_install = true
setenv =
    PYTHONPYCACHEPREFIX = {toxinidir}/.tmp/python-cache
    PRE_COMMIT_HOME = {toxinidir}/.tmp/pre-commit
    ANSIBLE_HOME = {toxinidir}/.tmp/ansible/home
    ANSIBLE_COLLECTIONS_PATH = {toxinidir}/.tmp/ansible/collections
    ANSIBLE_LOCAL_TEMP = {toxinidir}/.tmp/ansible/local-tmp
commands =
    pre-commit run -a --show-diff-on-failure
commands_post =
    python -c "import pathlib, shutil; shutil.rmtree(pathlib.Path(r'{toxinidir}') / '.ansible', ignore_errors=True)"

[testenv:oib-plan]
description = Run the installed side-effect-free OIB planner
package = wheel
skip_install = false
deps =
    PyYAML>=6.0.2
commands =
    oib {posargs}

[testenv:oib-build]
description = Run the installed native prepared-context builder
package = wheel
skip_install = false
deps =
    PyYAML>=6.0.2
commands =
    oib {posargs}

[testenv:oib-local]
description = Run the installed local Zuul-compatible OIB lifecycle
package = wheel
skip_install = false
deps =
    ansible-core==2.18.7
    tox>=4.28.0
commands =
    oib local {posargs}

[testenv:molecule]
description = Exercise provider registry and cleanup contracts with Molecule
deps =
    ansible-core==2.18.7
    molecule==26.6.0
    # Source-staging recursively verifies the wheel-installed planner.
    tox>=4.28.0
setenv =
    PYTHONPYCACHEPREFIX = {toxinidir}/.tmp/python-cache
    MOLECULE_EPHEMERAL_DIRECTORY = {toxinidir}/.tmp/molecule/ephemeral/{envname}
    ANSIBLE_HOME = {toxinidir}/.tmp/ansible/home
    ANSIBLE_COLLECTIONS_PATH = {toxinidir}/.tmp/ansible/collections
    ANSIBLE_LOCAL_TEMP = {toxinidir}/.tmp/ansible/local-tmp
    ANSIBLE_ROLES_PATH = {toxinidir}/.tmp/ansible/roles
commands =
    molecule reset -s provider-contract
    molecule test -s provider-contract
    molecule reset -s source-staging
    molecule test -s source-staging
    molecule reset -s local-registry
    molecule test -s local-registry

[testenv:update-sources]
description = Refresh source pins and generated lockfiles
setenv =
    {[testenv]setenv}
    XDG_CACHE_HOME = {toxworkdir}/{envname}/cache
commands =
    bash -c "rm -f ~/.cache/pybuild-deps/find-build-deps"
    bash {toxinidir}/build.sh update-sources {posargs:{env:TARGET:all}}

[testenv:update-lockfiles]
description = Refresh generated lockfiles without advancing source pins
setenv =
    {[testenv:update-sources]setenv}
    SKIP_HASH_UPDATE = 1
commands =
    bash -c "rm -f ~/.cache/pybuild-deps/find-build-deps"
    bash {toxinidir}/build.sh update-sources {posargs:{env:TARGET:all}}

[testenv:build]
commands =
    bash {toxinidir}/build.sh build all

[testenv:custom]
commands =
    bash {toxinidir}/build.sh {posargs}

[flake8]
select = H
ignore = H404,H405
show-source = true
exclude = .git,.tmp,.tox,.venv
