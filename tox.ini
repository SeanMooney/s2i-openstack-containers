[tox]
envlist = unit,linters
skipsdist = true
toxworkdir = {toxinidir}/.tmp/tox

[testenv]
setenv =
    PYTHONPYCACHEPREFIX = {toxinidir}/.tmp/python-cache
passenv =
    STREAM
    TARGET
    REGISTRY
    NAMESPACE
    TAG
    IMAGE_PREFIX
    BASE_IMAGE
    CONSTRAINTS_FILE
    BUILD_CONSTRAINTS_FILE
    DEFAULT_STREAM
    SKIP_HASH_UPDATE
    PIP_NO_BINARY
    REGISTRY_AUTH_FILE
    PARALLEL
    BUILD_LOGS_DIR
# pin to pip==26.1.2 as 26.2 has broken pip-tools
deps =
    pip-tools==7.6.0
    pybuild-deps==0.5.0
    pip==26.1.2
allowlist_externals =
    bash

[testenv:{unit,test,py3}]
description = Run all non-Ansible tests through stdlib unittest
commands =
    python -m unittest discover -s {toxinidir}/tests -p 'test_*.py' -v {posargs}

[testenv:linters]
description = Run formatting and style checks through pre-commit
deps =
    pre-commit>=3.0.0
skip_install = true
setenv =
    PYTHONPYCACHEPREFIX = {toxinidir}/.tmp/python-cache
    PRE_COMMIT_HOME = {toxinidir}/.tmp/pre-commit
    ANSIBLE_LOCAL_TEMP = {toxinidir}/.tmp/ansible/local-tmp
commands =
    pre-commit run -a --show-diff-on-failure

[testenv:update-sources]
description = Refresh source pins and generated lockfiles
commands =
    bash {toxinidir}/build.sh update-sources {env:TARGET:all}

[testenv:build]
commands =
    bash {toxinidir}/build.sh build all

[testenv:custom]
commands =
    bash {toxinidir}/build.sh {posargs}

[flake8]
select = H
ignore = H404,H405
show-source = true
exclude = .git,.tmp,.tox,.venv
