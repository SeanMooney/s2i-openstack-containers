---
- name: Prepare shared build tools
  ansible.builtin.import_playbook: ../shared/prepare-host.yaml

- name: Prepare the Zuul buildset registry
  hosts: builder
  vars:
    s2i_ci_output_dir: "{{ ansible_user_dir }}/zuul-output"
    s2i_ci_registry_root: "{{ ansible_user_dir }}/buildset_registry"
    s2i_ci_registry_connection_file: >-
      {{ s2i_ci_output_dir }}/.s2i-ci-registry-connection.json
    s2i_ci_registry_port: 5000
    s2i_ci_registry_image: quay.io/zuul-ci/zuul-registry@sha256:0bc02a2eed546daa570ebb18829579057cefceefd9ee15660dcf5a1a752d8f78

  tasks:
    - name: Record whether this job owns the buildset registry
      ansible.builtin.set_fact:
        s2i_ci_owns_buildset_registry: "{{ buildset_registry is not defined }}"

    - name: Discard a stale ownership marker for an inherited registry
      when: not s2i_ci_owns_buildset_registry | bool
      ansible.builtin.file:
        path: "{{ s2i_ci_registry_root }}/.s2i-ci-registry-owner.json"
        state: absent

    - name: Remove a stale project-owned buildset registry container
      when: s2i_ci_owns_buildset_registry | bool
      ansible.builtin.command:
        argv: [podman, rm, --force, buildset_registry]
      register: s2i_ci_stale_buildset_registry
      changed_when: s2i_ci_stale_buildset_registry.stdout | length > 0
      failed_when: s2i_ci_stale_buildset_registry.rc not in [0, 1]

    - name: Start the Zuul buildset registry
      when: s2i_ci_owns_buildset_registry | bool
      ansible.builtin.include_role:
        name: run-buildset-registry
      vars:
        buildset_registry_root: "{{ s2i_ci_registry_root }}"
        buildset_registry_port: "{{ s2i_ci_registry_port }}"
        buildset_registry_image: "{{ s2i_ci_registry_image }}"
        container_command: podman

    - name: Record ownership of the started buildset registry
      when: s2i_ci_owns_buildset_registry | bool
      ansible.builtin.copy:
        dest: "{{ s2i_ci_registry_root }}/.s2i-ci-registry-owner.json"
        mode: "0600"
        content: |
          {{ {
               'container': ('buildset_registry' if s2i_ci_registry_port | int == 5000 else 'buildset_registry_' + s2i_ci_registry_port | string),
               'port': s2i_ci_registry_port
             } | to_nice_json }}

    - name: Remove the unlabeled buildset registry container
      when:
        - s2i_ci_owns_buildset_registry | bool
        - ansible_selinux.status | default("disabled") == "enabled"
      ansible.builtin.command:
        argv:
          - podman
          - rm
          - --force
          - "{{ 'buildset_registry' if s2i_ci_registry_port | int == 5000 else 'buildset_registry_' + s2i_ci_registry_port | string }}"
      changed_when: true

    - name: Start the buildset registry with SELinux-labeled volumes
      when:
        - s2i_ci_owns_buildset_registry | bool
        - ansible_selinux.status | default("disabled") == "enabled"
      ansible.builtin.command:
        argv:
          - podman
          - run
          - --detach
          - "--name={{ 'buildset_registry' if s2i_ci_registry_port | int == 5000 else 'buildset_registry_' + s2i_ci_registry_port | string }}"
          - --restart=always
          - "--publish=1{{ s2i_ci_registry_port }}:5000"
          - "--volume={{ s2i_ci_registry_root }}/tls:/tls:Z"
          - "--volume={{ s2i_ci_registry_root }}/conf:/conf:Z"
          - "{{ s2i_ci_registry_image }}"
          - zuul-registry
          - -d
      changed_when: true

    - name: Wait for the buildset registry authentication endpoint
      when: s2i_ci_owns_buildset_registry | bool
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ s2i_ci_registry_port }}/v2/"
        validate_certs: false
        status_code: 401
      register: s2i_ci_buildset_registry_api
      retries: 30
      delay: 1
      until: s2i_ci_buildset_registry_api.status == 401

    - name: Configure the host to use the Zuul buildset registry
      ansible.builtin.include_role:
        name: use-buildset-registry
      vars:
        buildset_registry_namespaces:
          - [docker.io, https://registry-1.docker.io]
          - [quay.io, https://quay.io]
          - [gcr.io, https://gcr.io]
          - [registry.k8s.io, https://registry.k8s.io]
          - [registry.access.redhat.com, https://registry.access.redhat.com]

    - name: Set the Zuul buildset registry endpoint
      ansible.builtin.set_fact:
        s2i_ci_registry_endpoint: >-
          {{ buildset_registry_alias }}:{{ buildset_registry.port }}

    - name: Write the normalized registry connection
      ansible.builtin.copy:
        dest: "{{ s2i_ci_registry_connection_file }}"
        mode: "0600"
        content: |
          {{ {
               'endpoint': s2i_ci_registry_endpoint,
               'public_host': buildset_registry.host,
               'public_port': buildset_registry.port,
               'auth_file': '',
               'cert_dir': ''
             } | to_nice_json }}

- name: Validate the normalized buildset registry
  ansible.builtin.import_playbook: ../shared/validate-registry.yaml
