---
- name: Require the owned local buildset registry to become ready
  hosts: builder
  gather_facts: false

  tasks:
    - name: Wait for the local registry authentication endpoint
      ansible.builtin.uri:
        url: "https://localhost:{{ s2i_ci_registry_port }}/v2/"
        validate_certs: false
        status_code: 401
      register: s2i_ci_local_registry_api
      retries: 30
      delay: 1
      until: s2i_ci_local_registry_api.status == 401
