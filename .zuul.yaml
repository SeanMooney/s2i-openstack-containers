---
- job:
    name: s2i-openstack-containers-unit
    parent: tox
    description: Run the stdlib unit test suite.
    vars:
      tox_envlist: unit

- job:
    name: s2i-openstack-containers-linters
    parent: tox-linters
    description: Run repository formatting and style checks.

- job:
    name: s2i-openstack-containers-update-sources
    parent: tox
    description: Verify generated source metadata from committed source pins.
    post-run: playbooks/testing/update-sources-diff.yaml
    vars:
      tox_envlist: update-sources
      tox_environment:
        SKIP_HASH_UPDATE: "1"
        STREAM: master

- job:
    name: s2i-openstack-containers-molecule
    parent: tox
    description: Run provider registry, staging, and cleanup scenarios.
    vars:
      tox_envlist: molecule

- nodeset:
    name: s2i-openstack-containers-image-builder
    nodes:
      - name: builder
        label: cloud-centos-10-stream

- job:
    name: s2i-openstack-container-content-provider
    parent: base
    abstract: true
    description: |
      Build and publish speculative OpenStack service container images for
      dependent jobs.

      A non-empty ``s2i_ci_images`` list selects those images explicitly.
      Projects in the speculative item sequence add images through direct
      ``sources.txt`` repository records or static Python distribution matches
      against image dependency inputs. Their deterministic union and its
      required base are built. With neither an explicit image nor an
      external changed project, it builds all images.

      The job uses the upstream container repository by default. A child job
      can add another container repository to ``required-projects`` and select
      it with ``s2i_ci_container_project``.
    timeout: 7200
    nodeset: s2i-openstack-containers-image-builder
    required-projects:
      - github.com/openstack-k8s-operators/s2i-openstack-containers
      - opendev.org/zuul/zuul-jobs
      - opendev.org/openstack/requirements
      - opendev.org/openstack/cyborg
      - opendev.org/openstack/watcher
    pre-run:
      - playbooks/container-ci/zuul/reset-static-node.yaml
      - playbooks/container-ci/zuul/pre.yaml
    run: playbooks/container-ci/zuul/run.yaml
    post-run: playbooks/container-ci/zuul/post.yaml
    vars:
      s2i_ci_container_project: >-
        github.com/openstack-k8s-operators/s2i-openstack-containers
      s2i_ci_images: []
      s2i_ci_infer_images_from_dependencies: true
      s2i_ci_stream: master
      s2i_ci_content_provider: true
      s2i_ci_reset_static_node: false

# Personal-Zuul validation overlay. This commit is not part of the prototype
# series and is rebased as that series advances.
- nodeset:
    name: s2i-openstack-containers-static-test
    nodes:
      - name: controller
        label: almalinux-10-static

- nodeset:
    name: s2i-openstack-containers-static-image-builder
    nodes:
      - name: builder
        label: centos-10-stream-static

- job:
    name: s2i-openstack-containers-fork-provider
    parent: s2i-openstack-container-content-provider
    description: Validate selective publication in the personal Zuul.
    nodeset: s2i-openstack-containers-static-image-builder
    required-projects:
      - github.com/SeanMooney/s2i-openstack-containers
      - opendev.org/openstack/requirements
      - opendev.org/openstack/watcher
      - opendev.org/openstack/cyborg
      - opendev.org/zuul/zuul-jobs
    vars:
      s2i_ci_container_project: >-
        github.com/SeanMooney/s2i-openstack-containers
      s2i_ci_reset_static_node: true

- job:
    name: s2i-openstack-containers-provider-debug
    parent: base
    description: Print and validate selective provider return data.
    run: playbooks/testing/provider-return-debug.yaml

- project:
    check:
      jobs:
        - s2i-openstack-containers-unit
        - s2i-openstack-containers-linters
        - s2i-openstack-containers-update-sources
        - s2i-openstack-containers-molecule:
            nodeset: s2i-openstack-containers-static-test
            run: playbooks/testing/tox-static-node-run.yaml
        - s2i-openstack-containers-fork-provider
        - s2i-openstack-containers-provider-debug:
            dependencies:
              - s2i-openstack-containers-fork-provider
    gate:
      jobs:
        - s2i-openstack-containers-unit
        - s2i-openstack-containers-linters
        - s2i-openstack-containers-update-sources
        - s2i-openstack-containers-molecule:
            nodeset: s2i-openstack-containers-static-test
            run: playbooks/testing/tox-static-node-run.yaml
        - s2i-openstack-containers-fork-provider
        - s2i-openstack-containers-provider-debug:
            dependencies:
              - s2i-openstack-containers-fork-provider
